kind = "web"
previewPath = "/"
title = "StudyMate AI"
description = "A mobile-first AI study companion for college students to ask questions, create concise revision notes, and plan study sessions. Includes clearly labeled sample responses when AI is unavailable."
version = "1.0.0"
id = "artifacts/studymate-ai"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20945

[services.development]
run = "pnpm --filter @workspace/studymate-ai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/studymate-ai", "run", "build" ]
serve = "static"
publicDir = "artifacts/studymate-ai/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20945"
BASE_PATH = "/"
